<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor de Video</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    h1 {
      margin-top: 20px;
      font-size: 1.8rem;
    }

    .meta {
      margin-top: 10px;
      color: #ccc;
    }

    .tags {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #88f;
    }

    .likes {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      font-size: 0.9rem;
    }

    .likes span {
      background: #222;
      padding: 5px 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="video_player" controls></video>
  </div>

  <h1 id="video_title">Cargando...</h1>
  <div class="meta" id="videoDesc"></div>
  <div class="tags" id="videoTags"></div>
  <p id="video_description"></p>
  <div class="likes">
    <span id="video_likes">👍 0</span>
    <span id="video_dislikes">👎 0</span>
  </div>

  <script src="/js/ver_video.js"></script>
</body>
</html>
