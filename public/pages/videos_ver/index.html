<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soda Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://fonts.googleapis.com/css?family=Nunito:400,300' rel='stylesheet' type='text/css'>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
  <link rel="stylesheet" href="/pages/videos_ver/styles/style.videos_ver.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4431741015257754"
     crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
        <a href="/"><h1 class="text-gradient-green">Soda Stream</h1></a>
    </div>
  </header>
  <div class="video-container">
    <video id="video_player" controls></video>
  </div>
  <div class="video-info">
    <h1 id="video_title" class="text-gradient-green">Cargando...</h1>
    <div class="meta" id="videoDesc"></div>
    <div class="tags" id="videoTags"></div>
    <p id="video_description"></p>
    <div class="likes">
      <span id="video_views">0</span>
      <span id="video_likes">👍 0</span>
      <span id="video_dislikes">0 👎</span>
    </div>
  </div>
  <div id="related_videos">

  </div>

  <div id="notif_container" class="notif_container">
    <div class="notif">    
      <span>Notificación</span>
      <p>Se ha subido un nuevo capítulo de One punch man</p>
    </div>
  </div>

  <script src="/pages/videos_ver/functions/constants.js"></script>
  <script src="/pages/videos_ver/functions/functions.js"></script>
</body>
</html>
