<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Soda Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Nunito:400,300' rel='stylesheet' type='text/css'>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
    <link rel="stylesheet" href="/pages/general/librerias/graphic/styles/style.default_dark.css" />
</head>

<body>
    <div id="root"></div>
    <script src="/pages/general/librerias/graphic/lib.js"></script>

    <!-- Forms -->
    <script src="/pages/sign_in/forms/form.signin.js"></script>

    <!-- Containers -->
    <script src="/pages/sign_in/containers/container.signin.js"></script>

    <!-- Functions -->
    <script src="/pages/sign_in/functions/fun.constants.js"></script>
    <script src="/pages/sign_in/functions/fun.users_signin.js"></script>



    <script>
        let root = document.getElementById('root');


        Gb.define('header', {
            type: 'header',
            id: 'header.signin',
            title: 'Soda Stream',
            //cls: 'header_signin'
        })

        Gb.define('container', {
            type: 'container',
            id: 'main_container',
            items: [
                Gb.getComponent('header.signin').getEl(),
                Gb.getComponent('container_signin').getEl()
            ]
        })


        root.append(Gb.getComponent('main_container').getEl());
    </script>
</body>

</html>
