<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      padding: 20px;
    }
    form {
      background: #1c1c1c;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    input, textarea {
      background: #1c1c1c;
      color: #fff;
      width: 95%;
      margin-bottom: 10px;
      padding: 8px;
      border: solid 1px gray;
      border-radius: 6px;
    }

    textarea {
      min-height: 200px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
      align-items: right;
    }
    #status {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Subir Video</h2>
  <form id="uploadForm">
    <label>Nombre del video</label>
    <input type="text" name="vid_nombre" required />

    <label>Descripción</label>
    <textarea name="vid_descripcion"></textarea>

    <label>Tags</label>
    <input type="text" name="vid_tags" placeholder="ej. acción, anime, comedia" />

    <label>ID de usuario</label>
    <input type="number" name="vid_id_usuario" required />

    <label>Archivo de video</label>
    <input type="file" name="video" accept="video/*" required />

    <button type="submit">Subir Video</button>
  </form>
  <div>  
    <span id="progress-text">0%</span>
    <div id="progress-details"></div>
    <div id="status"></div>
  </div>
  <br/>
  <form id="uploadThumb">
    <input id="frm_id_video" type="text" name="vid_id" value="${data.data.vid_id}" hidden required/>
    <label>Miniatura</label>
    <input type="file" name="image" accept="image/*" required />
    <button type="submit">Subir Miniatura</button>
  </form>
  <div id="img_status"></div>


  <script src="/pages/videos_subir/functions/constants.js"></script>
  <script src="/pages/videos_subir/functions/functions.js"></script>
</body>
</html>
