<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Soda Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Nunito:400,300' rel='stylesheet' type='text/css'>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
    <link rel="stylesheet" href="/pages/general/librerias/graphic/styles/style.dark_gradient.css" />
</head>

<body>
    <div id="root"></div>
    <script src="/pages/general/librerias/graphic/lib.js"></script>
    <script src="/pages/general/functions/fun.constants.js"></script>
    <script src="/pages/general/functions/fun.general.js"></script>

    <!-- Functions -->
    <script src="/pages/videos_subir_v2/functions/fun.constants.js"></script>
    <script src="/pages/videos_subir_v2/functions/fun.subir_videos.js"></script>

    <!-- Combos -->
    <script src="/pages/videos_subir_v2/combos/combo.series.js"></script>
    <script src="/pages/videos_subir_v2/combos/combo.temporadas.js"></script>
    <script src="/pages/videos_subir_v2/combos/combo.thumbnails.js"></script>

    <!-- Forms -->
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.externo.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.editar.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_buscar.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.thumbnail_subir.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.nueva_serie.js"></script>
    <script src="/pages/videos_subir_v2/forms/form.videos_subir.nueva_temporada.js"></script>

    <!-- Grids -->
    <script src="/pages/videos_subir_v2/grids/grid.videos.js"></script>

    <!-- Windows -->
    <script src="/pages/videos_subir_v2/windows/windows.js"></script>

    <!-- Toolbars -->
    <script src="/pages/videos_subir_v2/toolbars/toolbar.videos_subir.js"></script>

    <script>
        let root = document.getElementById('root');


        Gb.define('header', {
            type: 'header',
            id: 'header.videos_subir',
            title: 'Soda Stream',
            //cls: 'header_signin',
            search: true,
            onSearchClick: function(value) {
                console.log('Search for:', value);
            }
        })

        

        Gb.define('container', {
            type: 'container',
            id: 'container_videos_subir',
            items: [
                Gb.getComponent('header.videos_subir').getEl(),
                Gb.getComponent('frm_videos_buscar').getEl(),
                Gb.getComponent('tlb_videos_subir').getEl(),
                Gb.getComponent('grid_videos').getEl(),
            ]
        })


        root.append(Gb.getComponent('container_videos_subir').getEl());
    </script>
</body>

</html>
